<style>
:root{--blue:#2338ff;--ink:#fff;--sun:#ffd400;--night:#0b1070;--red:#e5162b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--blue);color:var(--ink);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:calc(64px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

/* Язык */
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:6px}
.lang button{border:.12em solid #fff;background:transparent;color:#fff;font:800 12px 'Manrope',sans-serif;
  padding:6px 16px;border-radius:999px;cursor:pointer;border-width:2px}
.lang button.on{background:#fff;color:var(--night)}

/* Контент */
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}

.pop{opacity:0;transform:scale(.85);animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}

/* Цена */
.price{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.old{position:relative;background:#fff;color:var(--night);font-family:'Unbounded','Arial Black',sans-serif;font-weight:800;
  font-size:18px;padding:9px 14px;border-radius:12px;transform:rotate(-3deg)}
.old::after{content:"";position:absolute;left:-2%;top:52%;height:4px;width:0;background:var(--red);transform:rotate(3deg);
  animation:strike .5s .9s ease-out forwards}
@keyframes strike{to{width:104%}}
.new{background:var(--sun);color:var(--night);font-family:'Unbounded','Arial Black',sans-serif;font-weight:800;
  font-size:18px;padding:9px 14px;border-radius:12px}

h1{font-family:'Unbounded','Arial Black',sans-serif;font-weight:800;font-size:clamp(28px,9vw,38px);
  line-height:1.12;letter-spacing:-.01em}
h1 span{display:inline-block;background:var(--sun);color:var(--night);padding:2px 12px 6px;border-radius:12px;margin-top:6px}

.sub{font-size:17px;line-height:1.45;font-weight:600;opacity:.92}

.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{font-weight:800;font-size:14px;background:rgba(255,255,255,.16);border:2px solid #fff;
  border-radius:999px;padding:8px 16px}
.tags .more{background:var(--sun);color:var(--night);border-color:var(--sun)}

.arrow{align-self:center;font-size:44px;line-height:1;animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* Кнопка */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  padding:18px 20px;border-radius:18px;text-decoration:none;color:var(--night);
  background:var(--sun);box-shadow:0 6px 0 var(--night);
  cursor:pointer;position:relative;z-index:10;animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards .5s,beat 1s ease-in-out infinite 1.1s;opacity:0}
@keyframes beat{50%{transform:scale(1.035)}}
.btn:active{animation:none;opacity:1;transform:translateY(5px);box-shadow:0 1px 0 var(--night)}
.btn *{pointer-events:none}
.btn svg{width:28px;height:28px;flex:none}
.btn .t{text-align:left;line-height:1.2}
.btn b{display:block;font-family:'Unbounded','Arial Black',sans-serif;font-size:17px;font-weight:800}
.btn small{display:block;font-size:12.5px;font-weight:600;opacity:.8;margin-top:3px}

.note{font-size:13px;font-weight:600;opacity:.85;text-align:center}

@media(max-height:640px){.card{gap:14px}h1{font-size:26px}.arrow{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}.old::after{width:104%}}

<body ontouchstart="">

<div class="lang" role="group" aria-label="Language">
  <button data-l="ru">RU</button>
  <button data-l="uz" class="on">UZ</button>
</div>

<main class="card">
  <div class="price pop">
    <span class="old" data-i="old">3 000 000 so‘m</span>
    <span class="new" data-i="new">0 so‘m</span>
  </div>

  <h1 class="pop" style="--d:.15s" data-i="h1">Bepul <span>IT kurslar</span></h1>
  <p class="sub pop" style="--d:.3s" data-i="sub">Zayavka qoldiring va kursni hoziroq oling.</p>

  <div class="tags">
    <span class="pop" style="--d:.5s" data-i="t1">⚡ Darhol</span>
    <span class="pop" style="--d:.65s" data-i="t2">🧩 Noldan</span>
    <span class="pop" style="--d:.8s" data-i="t3">📱 Telefondan</span>
    <span class="pop more" style="--d:.95s" data-i="t4">va yana ko‘p narsa</span>
  </div>

  <div class="arrow" aria-hidden="true">↓</div>

  <a href="https://t.me/+IAgMWlYM6b5lZWMy" target="_blank" rel="noopener noreferrer" class="btn" id="cta">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 15.17l-.4 4.2c.58 0 .83-.25 1.13-.55l2.7-2.58 5.6 4.1c1.03.57 1.76.27 2.04-.95l3.7-17.3c.33-1.52-.55-2.12-1.55-1.75L1.3 9.7c-1.5.6-1.48 1.43-.26 1.8l5.5 1.72L19.3 5.2c.6-.4 1.15-.18.7.22z"/></svg>
    <span class="t"><b data-i="cta">Zayavka qoldirish</b><small data-i="cta2">Оставить заявку</small></span>
  </a>

  <p class="note" data-i="note">🔒 To‘lovsiz · Telegram ochiladi</p>
</main>

<script>
const T={
  ru:{old:"3 000 000 сум",new:"0 сум",h1:'Бесплатные <span>IT курсы</span>',sub:"Оставь заявку и получи курс прямо сейчас.",
      t1:"⚡ Сразу",t2:"🧩 С нуля",t3:"📱 С телефона",t4:"и многое другое",cta:"Оставить заявку",cta2:"Zayavka qoldirish",note:"🔒 Без оплаты · откроется Telegram"},
  uz:{old:"3 000 000 so‘m",new:"0 so‘m",h1:'Bepul <span>IT kurslar</span>',sub:"Zayavka qoldiring va kursni hoziroq oling.",
      t1:"⚡ Darhol",t2:"🧩 Noldan",t3:"📱 Telefondan",t4:"va yana ko‘p narsa",cta:"Zayavka qoldirish",cta2:"Оставить заявку",note:"🔒 To‘lovsiz · Telegram ochiladi"}
};
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T[l][e.dataset.i]; if(v!==undefined) e.innerHTML=v});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

// Принудительно открываем на узбекском языке по умолчанию
setLang('uz');

document.getElementById('cta').addEventListener('click',()=>{ if(window.fbq) fbq('track','Lead'); });

// ЗАПРЕТ КОНТЕКСТНОГО МЕНЮ И КОПИРОВАНИЯ
document.addEventListener('contextmenu', e => {
  if (e.target.closest('a') === null) { e.preventDefault(); }
});
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('selectstart', e => {
  if (e.target.closest('a') === null) { e.preventDefault(); }
});
</script>
